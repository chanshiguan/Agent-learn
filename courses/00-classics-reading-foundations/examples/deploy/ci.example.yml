# 将本课程目录作为独立仓库时，复制到 .github/workflows/check.yml。
# 只运行无需模型密钥的行为检查；不会自动部署或宣称文学质量通过。
name: companion-checks
on: [push, pull_request]
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装行为检查需要的依赖
        run: python -m pip install -r examples/requirements.txt -r examples/requirements-model.txt -r examples/requirements-web.txt -r examples/requirements-graph.txt qdrant-client==1.15.1
      - name: 检查权限、批准与恢复，不调用真实模型
        run: python -m unittest discover -s tests -v

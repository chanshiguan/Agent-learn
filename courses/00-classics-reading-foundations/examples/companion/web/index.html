<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>名著伴读 · 阅读与思考</title><link rel="stylesheet" href="/static/reader.css"></head><body>
<header><span class="brand">名著伴读</span><span>读一段，想一想，再找依据。</span><button id="logout" hidden>退出登录</button></header>
<main><section id="login-panel" hidden><h1>回到你的阅读</h1><p>用已创建的账号登录，继续之前的阅读记录。</p><form id="login-form"><label>机构标识<input name="tenant" value="demo" required maxlength="40"></label><label>账号<input name="username" autocomplete="username" required maxlength="40"></label><label>口令<input name="password" type="password" autocomplete="current-password" required maxlength="128"></label><button>登录</button></form></section>
<section id="workspace" hidden><div class="intro"><p id="lab-notice" class="notice" hidden>本机练习模式：使用虚构读者，不录入真实学生信息。</p><h1>今天，想读懂哪一处？</h1><p>可以直接提问，也可以先说说你的理解。讲解有依据，观点可以讨论。</p></div>
<div class="workspace"><aside><div id="lab-picker" hidden><label for="reader">切换测试读者</label><select id="reader"><option value="reader-a">测试读者 A</option><option value="reader-b">测试读者 B</option></select></div><label for="book">作品</label><select id="book"><option>狂人日记</option></select><button id="new-session">开始一次阅读</button><h2>我的阅读记录</h2><div id="sessions"></div><button class="secondary" id="refresh">刷新记录</button><div data-chapter="15"><h2>阅读范围</h2><label for="progress">已核对的阅读进度编号</label><input id="progress" type="number" min="0" max="10000" value="0"><label class="check"><input id="strict" type="checkbox">只看已核对范围的片段</label><button class="secondary" id="save-progress">保存范围</button><p class="hint">范围变化后，旧对话上下文会清空。</p></div><button class="danger" id="delete-session">删除当前阅读记录</button><div data-chapter="21"><h2>个人资料</h2><button class="danger" id="erase">删除我的个人阅读内容</button></div></aside>
<section class="reading"><p id="selected">先选择或创建一次阅读。</p><form id="ask-form"><label for="question">你想问什么？</label><textarea id="question" maxlength="800" required placeholder="例如：文言文序言和白话日记有什么关系？"></textarea><label for="mode">怎样一起读</label><select id="mode"><option value="qa">直接解答</option><option value="tutor" data-chapter="16">先引导我思考</option><option value="agent" data-chapter="18">需要时多查几处资料</option></select><div class="actions"><button id="ask">查资料并回答</button><button type="button" class="secondary" id="cancel" hidden>停止等待后续结果</button></div></form><article id="result" hidden><h2>一起看看</h2><p id="answer"></p><h3>回答依据</h3><div id="sources"></div><div class="feedback"><label for="category">这个回答哪里需要改进？</label><select id="category"><option>答非所问</option><option>证据不符</option><option>内容不适合</option><option>其他</option></select><button class="secondary" id="feedback">提交反馈</button></div></article>
<section data-chapter="19"><h2>留下阅读收获</h2><p>先生成草稿，你确认后才会保存。</p><div class="actions"><button class="secondary" id="draft-note">生成笔记草稿</button><button class="secondary" id="draft-plan">生成复习计划草稿</button></div><div id="drafts"></div><h3>已保存的笔记</h3><div id="notes"></div></section>
<section id="family-panel" hidden><h2>孩子明确记录的进度</h2><label for="child">已关联的读者账号</label><input id="child"><button class="secondary" id="family">查看进度</button><pre id="family-result"></pre><p class="hint">这里不展示孩子的私密对话或笔记。</p></section></section></div></section><p id="status" role="status" aria-live="polite"></p></main><footer>讲稿中的解释可以讨论。引用用于回查，不代表每个观点都是唯一答案。</footer><script src="/static/reader.js"></script></body></html>

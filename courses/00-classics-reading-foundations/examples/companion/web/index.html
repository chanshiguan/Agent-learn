<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>名著伴读 · 阅读与思考</title>
    <link rel="stylesheet" href="/static/reader.css" />
  </head>
  <body>
    <h1>一起读《狂人日记》</h1>
    <p id="lab-notice">本机练习：只使用虚构读者。</p>
    <div id="lab-picker">
      <label for="reader">测试读者</label>
      <select id="reader">
        <option value="reader-a">读者 A</option>
        <option value="reader-b">读者 B</option>
      </select>
    </div>
    <section id="login-panel" hidden>
      <h1>登录你的阅读账号</h1>
      <form id="login-form">
        <label>机构<input name="tenant" value="demo" required maxlength="40" /></label>
        <label
          >账号<input name="username" autocomplete="username" required maxlength="40"
        /></label>
        <label
          >口令<input
            name="password"
            type="password"
            autocomplete="current-password"
            required
            maxlength="128"
        /></label>
        <button>登录</button>
      </form>
    </section>
    <button id="logout" hidden>退出登录</button>
    <section id="family-panel" hidden>
      <h2>孩子明确记录的进度</h2>
      <label for="child">已关联账号</label><input id="child" /><button id="family">
        查看进度
      </button>
      <pre id="family-result"></pre>
    </section>
    <main id="workspace">
      <label for="book">作品</label
      ><select id="book">
        <option>狂人日记</option>
      </select>
      <button id="new-session">开始一次阅读</button>
      <button id="refresh">刷新记录</button>
      <div id="sessions"></div>
      <p id="selected">先选择或创建一次阅读。</p>
      <label for="progress">已核对的阅读进度编号</label>
      <input id="progress" type="number" min="0" max="10000" value="0" />
      <label><input id="strict" type="checkbox" />只看已核对范围的片段</label>
      <button id="save-progress">保存范围</button>
      <button id="delete-session">删除当前阅读记录</button>
      <form id="ask-form">
        <label for="question">想问什么？</label>
        <textarea id="question" required maxlength="800"></textarea>
        <select id="mode" aria-label="伴读方式">
          <option value="qa">直接解答</option>
          <option value="tutor">先说理解，再看提示</option>
          <option value="agent">需要时调用工具</option>
        </select>
        <button id="ask">查资料并回答</button
        ><button type="button" id="cancel" hidden>停止后续处理</button>
      </form>
      <article id="result" hidden>
        <p id="answer"></p>
        <div id="sources"></div>
        <label for="category">反馈类型</label
        ><select id="category">
          <option>答非所问</option>
          <option>证据不符</option>
          <option>内容不适合</option>
          <option>其他</option></select
        ><button id="feedback">提交反馈</button>
      </article>
      <section>
        <h2>阅读笔记</h2>
        <button id="draft-note">生成笔记草稿</button
        ><button id="draft-plan">生成复习计划草稿</button>
        <div id="drafts"></div>
        <h3>已确认的笔记</h3>
        <div id="notes"></div>
      </section>
      <button id="erase">删除我的个人阅读内容</button>
    </main>
    <p id="status" role="status"></p>
    <script src="/static/reader.js"></script>
  </body>
</html>

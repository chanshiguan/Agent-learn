name: Review and publish public course
on:
  push:
    branches: [codex/public-course]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-course-pages
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: 安装离线行为检查依赖
        working-directory: courses/00-classics-reading-foundations
        run: python -m pip install -r examples/requirements.txt -r examples/requirements-model.txt -r examples/requirements-web.txt -r examples/requirements-graph.txt qdrant-client==1.15.1
      - name: 检查业务、并发删除和页面迟到响应
        working-directory: courses/00-classics-reading-foundations
        run: |
          python -m unittest discover -s tests -v
          node tests/reader-races.cjs
          python tooling/replay_writing.py
      - name: 真实构建 Docker 并验证 Compose
        run: python courses/00-classics-reading-foundations/tooling/container_smoke.py
      - name: 重新生成教材
        run: |
          npm ci --ignore-scripts
          npm run build
          python courses/00-classics-reading-foundations/tooling/verify_public.py
      - name: 仅将公开清单复制到网站目录
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          root=Path.cwd(); site=root/'_site'; site.mkdir()
          files=json.loads((root/'publication-files.json').read_text())['files']
          files+=['publication-files.json']
          for name in files:
              target=site/name; target.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(root/name,target)
          PY
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布已通过检查的教材
        id: deployment
        uses: actions/deploy-pages@v5
